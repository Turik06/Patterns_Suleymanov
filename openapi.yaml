openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API "ООО <Ромашка>"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/reports/formats:
    get:
      summary: Список форматов отчетов
      description: Возвращает список всех форматов для построения отчетов
      operationId: main.get_report_formats
      responses:
        '200':
          description: Список форматов в JSON
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["TXT", "CSV", "MARKDOWN", "XML", "HTML", "RTF"]

  /api/entity/{entity_type}:
    put:
      summary: Создать сущность (PUT)
      description: Создать новую доменную сущность
      operationId: main.create_domain_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
          description: Тип сущности (например, range_model, group_model, storage_model, nomenclature_model, recipe_model)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сущность успешно создана
        '400':
          description: Ошибка валидации или нарушение связей

    post:
      summary: Создать сущность (POST)
      description: Создать новую доменную сущность через POST
      operationId: main.create_domain_entity_post
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
          description: Тип сущности
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сущность успешно создана
        '400':
          description: Ошибка валидации или нарушение связей

  /api/entity/{entity_type}/{unique_code}:
    get:
      summary: Получить сущность (GET)
      description: Получить сущность по ее коду
      operationId: main.get_domain_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные сущности в JSON
        '404':
          description: Сущность не найдена

    patch:
      summary: Обновить сущность (PATCH)
      description: Обновить поля сущности
      operationId: main.update_domain_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Сущность обновлена
        '400':
          description: Ошибка валидации
        '404':
          description: Сущность не найдена
        '409':
          description: Запрещено менять код связанной сущности

    delete:
      summary: Удалить сущность (DELETE)
      description: Удалить сущность по коду
      operationId: main.delete_domain_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Сущность удалена
        '400':
          description: Ошибка запроса
        '404':
          description: Сущность не найдена
        '409':
          description: Запрещено удалять связанную сущность

  /api/get_default_report:
    get:
      summary: Получить отчет по сущности
      description: Генерирует отчет для конкретного объекта по его уникальному коду.
      operationId: main.get_default_report
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: Ключ сущности (например, nomenclature_model, group_model).
        - name: unique_code
          in: query
          required: true
          schema:
            type: string
          description: Уникальный код конкретного объекта.
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain: 
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Отсутствует параметр entity"
        '500':
          description: Внутренняя ошибка сервера.
          content:
            text/plain:
              schema:
                type: string
              example: "Ошибка: Невозможно получить требуемый отчет!"

  /api/get_entities:
    get:
      summary: Получить список доменных сущностей
      description: Возвращает список всех доступных ключей (типов моделей), которые есть в хранилище.
      operationId: main.get_entities
      responses:
        '200':
          description: Список ключей сущностей в формате JSON.
          content:
            text/json: 
              schema:
                type: array
                items:
                  type: string
              example: ["range_model", "group_model", "storage_model", "nomenclature_model", "receipt_model"]
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Невозможно получить список доменных сущностей!"

  /api/filter/{domain_type}:
    post:
      summary: Фильтрация сущностей
      description: Фильтрует список доменных сущностей по DTO фильтрации
      operationId: main.filter_domain_entities
      parameters:
        - name: domain_type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDto'
      responses:
        '200':
          description: Список отфильтрованных сущностей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Некорректный тип сущности или неверные параметры фильтра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'

  /api/osv:
    post:
      summary: Оборотно-сальдовая ведомость
      description: Формирует ОСВ с учетом фильтрации через Прототип
      operationId: main.get_osv_report
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterDto'
      responses:
        '200':
          description: Строки оборотно-сальдовой ведомости
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OsvRowDto'
        '400':
          description: Некорректные параметры фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'

components:
  schemas:
    FilterTypeEnum:
      type: string
      enum:
        - EQUALS
        - LIKE
      description: Тип операции фильтрации (EQUALS - точное совпадение, LIKE - вхождение строки)

    FilterItemDto:
      type: object
      required:
        - field_name
        - value
      properties:
        field_name:
          type: string
          description: Имя поля для фильтрации
          example: name
        filter_type:
          $ref: '#/components/schemas/FilterTypeEnum'
        value:
          description: Искомое значение для сравнения
          example: "Мука"

    FilterDto:
      type: object
      properties:
        name:
          type: string
          description: Наименование для быстрой фильтрации
          example: "Мука"
        unique_code:
          type: string
          description: Уникальный код для быстрой фильтрации
          example: "b1a7d6e4-44b3-4613-8a3b-179836561cf2"
        filter_type:
          $ref: '#/components/schemas/FilterTypeEnum'
        filters:
          type: array
          description: Список дополнительных критериев фильтрации
          items:
            $ref: '#/components/schemas/FilterItemDto'
        start_date:
          type: string
          format: date-time
          description: Начальная дата периода для ОСВ (ISO 8601)
          example: "2026-01-01T00:00:00"
        end_date:
          type: string
          format: date-time
          description: Конечная дата периода для ОСВ (ISO 8601)
          example: "2026-01-31T23:59:59"

    OsvRowDto:
      type: object
      properties:
        storage:
          type: string
          description: Наименование склада
          example: "Основной склад"
        nomenclature:
          type: string
          description: Наименование номенклатуры
          example: "Мука пшеничная"
        range:
          type: string
          description: Наименование единицы измерения
          example: "кг"
        start_balance:
          type: number
          format: float
          description: Начальный остаток (сальдо на начало периода)
          example: 0.0
        incoming:
          type: number
          format: float
          description: Оборот по приходу за период
          example: 100.0
        outgoing:
          type: number
          format: float
          description: Оборот по расходу за период
          example: 30.0
        final_balance:
          type: number
          format: float
          description: Конечный остаток (сальдо на конец периода)
          example: 70.0

    ErrorDto:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
          example: "Ожидается JSON объект параметров фильтрации"



